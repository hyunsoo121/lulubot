services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./public/screenshots:/app/public/screenshots
    depends_on:
      - redis
      - postgres
    networks:
      - lulubot-net

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lulubot-net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - lulubot-net

networks:
  lulubot-net:
    driver: bridge
    name: lulubot-net

volumes:
  redis_data:
  postgres_data:
